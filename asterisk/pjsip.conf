[general]

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[1001]
type=endpoint
context=default
disallow=all
allow=ulaw,alaw
dtmf_mode=rfc4733
direct_media=no
force_rport=yes
rewrite_contact=yes
auth=1001
aors=1001

[1001]
type=auth
auth_type=userpass
username=1001
password=YOUR_SIP_PASSWORD

[1001]
type=aor
max_contacts=1
remove_existing=yes
